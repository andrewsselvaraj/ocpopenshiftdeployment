# Full local stack: MySQL 8 pre-loaded with the legacy m2its dump + the four services.
#   cp .env.example .env    (then edit the secrets)
#   docker compose up --build
# Ports: auth 8080, org 8082, question 8084, exam 8086 (management/actuator: +1 inside the container only).

x-service: &service
  build:
    context: .
  restart: unless-stopped
  env_file: .env
  environment: &env
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_NAME: m2its
    QUESTION_SERVICE_URL: http://question-service:8080
  depends_on:
    mysql:
      condition: service_healthy
  healthcheck:
    # Plain bash HTTP request: works without curl in the minimal runtime image.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 30s

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: m2its
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      # Imported once, on the first start with an empty volume.
      - ./m2itssql_complete.sql:/docker-entrypoint-initdb.d/01-m2its.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  auth-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: auth-service }
    image: m2i/auth-service:local
    ports: ["8080:8080"]

  org-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: org-service }
    image: m2i/org-service:local
    ports: ["8082:8080"]

  question-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: question-service }
    image: m2i/question-service:local
    ports: ["8084:8080"]

  exam-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: exam-service }
    image: m2i/exam-service:local
    ports: ["8086:8080"]
    depends_on:
      mysql:
        condition: service_healthy
      question-service:
        condition: service_healthy

volumes:
  mysql-data:
