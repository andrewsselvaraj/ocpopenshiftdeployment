name: ci-cd

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/online-exam

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and run integration tests
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

  images:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, org-service, question-service, exam-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image (fail on fixable critical CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image
        run: docker push --all-tags ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}

  deploy-openshift:
    needs: images
    if: github.ref == 'refs/heads/main' && vars.OPENSHIFT_NAMESPACE != ''
    runs-on: ubuntu-latest
    environment: openshift
    steps:
      - uses: actions/checkout@v4
      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"
      - name: Log in to OpenShift
        run: oc login --token="${{ secrets.OPENSHIFT_TOKEN }}" --server="${{ secrets.OPENSHIFT_SERVER }}"
      - name: Apply manifests
        run: oc apply -k k8s/overlays/openshift -n "${{ vars.OPENSHIFT_NAMESPACE }}"
      - name: Point image streams at this commit's images (triggers rollouts)
        run: |
          for s in auth-service org-service question-service exam-service; do
            oc tag --source=docker "${IMAGE_PREFIX}/${s}:${GITHUB_SHA}" "${s}:latest" \
              --reference-policy=local -n "${{ vars.OPENSHIFT_NAMESPACE }}"
          done
      - name: Verify deployment
        env:
          ADMIN_EMAIL: ${{ secrets.VERIFY_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.VERIFY_ADMIN_PASSWORD }}
        run: bash scripts/verify-deployment.sh --openshift -n "${{ vars.OPENSHIFT_NAMESPACE }}"
